<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #stage {
      position: relative;
      width: 560px;
      height: 380px;
      border-radius: 16px;
      overflow: hidden;
      background: #0d0a1f;
      border: 1px solid rgba(192, 132, 252, 0.35);
      box-shadow: 0 0 25px rgba(112, 0, 255, 0.25);
    }
    #webcam {
      position: absolute;
      top: 0; left: 0;
      width: 1px; height: 1px;
      opacity: 0.001;
      pointer-events: none;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 560px; height: 380px;
    }
    #camCanvas { z-index: 1; transform: scaleX(-1); opacity: 0.88; filter: contrast(1.05); }
    #paintCanvas { z-index: 2; }
    #cursorCanvas { z-index: 3; pointer-events: none; }
    
    .toolbar {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    button {
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 30px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-start { 
      background: rgba(30, 27, 75, 0.85); 
      color: #c084fc; 
      border-color: rgba(192, 132, 252, 0.4); 
    }
    .btn-clear { 
      background: rgba(15, 23, 42, 0.85); 
      color: #94a3b8; 
      border-color: rgba(148, 163, 184, 0.2); 
    }
    .btn-send { 
      background: linear-gradient(135deg, #c084fc 0%, #38bdf8 100%); 
      color: #0b081d; 
      font-weight: 700;
      box-shadow: 0 0 20px rgba(192, 132, 252, 0.45);
    }
    button:hover { 
      filter: brightness(1.15); 
      transform: translateY(-2px) scale(1.02); 
    }
    #status {
      margin-top: 8px;
      font-size: 12.5px;
      color: #cbd5e1;
      min-height: 18px;
      text-shadow: 0 0 8px rgba(192, 132, 252, 0.5);
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="camCanvas" width="560" height="380"></canvas>
    <canvas id="paintCanvas" width="560" height="380"></canvas>
    <canvas id="cursorCanvas" width="560" height="380"></canvas>
  </div>

  <div class="toolbar">
    <button class="btn-start" id="startBtn" onclick="startCamera()">🪄 Activar espejo</button>
    <button class="btn-clear" onclick="clearCanvas()">Borrar trazo</button>
    <button class="btn-send" onclick="sendToStreamlit()">✨ Tejer en la historia</button>
  </div>
  <div id="status">Toca "Activar espejo" para encender la luz mágica ✨</div>

  <script>
    function sendStreamlitMsg(type, data = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }
    function notifyReady() {
      sendStreamlitMsg("streamlit:componentReady", { apiVersion: 1 });
      sendStreamlitMsg("streamlit:setFrameHeight", { height: 470 });
    }
    window.addEventListener("message", (e) => {
      if (e.data.type === "streamlit:render") sendStreamlitMsg("streamlit:setFrameHeight", { height: 470 });
    });
    notifyReady();
    window.addEventListener("load", notifyReady);

    const video = document.getElementById('webcam');
    const camCanvas = document.getElementById('camCanvas');
    const camCtx = camCanvas.getContext('2d');
    const paintCanvas = document.getElementById('paintCanvas');
    const pCtx = paintCanvas.getContext('2d');
    const curCanvas = document.getElementById('cursorCanvas');
    const curCtx = curCanvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    let prevPoint = null;
    let handsDetector = null;
    let isRunning = false;
    let isProcessing = false;

    try {
      handsDetector = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      handsDetector.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
      handsDetector.onResults(onResults);
    } catch (e) {}

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusDiv.innerText = "La cámara requiere una conexión HTTPS segura.";
        return;
      }
      try {
        startBtn.disabled = true;
        statusDiv.innerText = "Despertando el espejo mágico...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        isRunning = true;
        startBtn.style.display = "none";
        statusDiv.innerText = "✨ ¡Espejo listo! Junta índice y pulgar para pintar con luz";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        startBtn.disabled = false;
        statusDiv.innerText = "No se pudo encender la cámara: " + err.message;
      }
    }

    async function renderLoop() {
      if (!isRunning) return;
      if (!isProcessing && video.readyState >= 2 && !video.paused) {
        isProcessing = true;
        try {
          if (handsDetector) await handsDetector.send({ image: video });
        } catch (e) {}
        isProcessing = false;
      }
      requestAnimationFrame(renderLoop);
    }

    function clearCanvas() {
      pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      statusDiv.innerText = "Lienzo limpio como una noche despejada 🌌";
    }

    function getBoundingBox(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = 0, maxY = 0;
      let hasPixels = false;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (data[(y * w + x) * 4 + 3] > 30) {
            hasPixels = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!hasPixels) return null;
      return {
        x: Math.max(0, minX - 14),
        y: Math.max(0, minY - 14),
        w: Math.min(w, (maxX - minX) + 28),
        h: Math.min(h, (maxY - minY) + 28)
      };
    }

    function sendToStreamlit() {
      const box = getBoundingBox(pCtx, paintCanvas.width, paintCanvas.height);
      if (!box) {
        statusDiv.innerText = "Dibuja primero tu figura pellizcando los dedos ✨";
        return;
      }

      const cCanvas = document.createElement('canvas');
      cCanvas.width = box.w; cCanvas.height = box.h;
      cCanvas.getContext('2d').drawImage(paintCanvas, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
      const cutoutBase64 = cCanvas.toDataURL('image/png');

      const vCanvas = document.createElement('canvas');
      vCanvas.width = box.w; vCanvas.height = box.h;
      const vCtx = vCanvas.getContext('2d');
      vCtx.fillStyle = '#FFFFFF';
      vCtx.fillRect(0, 0, box.w, box.h);
      vCtx.drawImage(cCanvas, 0, 0);
      const visionBase64 = vCanvas.toDataURL('image/png');

      // Unique ID triggers execution instantly
      sendStreamlitMsg("streamlit:setComponentValue", {
        value: JSON.stringify({
          cutout: cutoutBase64,
          vision: visionBase64,
          id: String(Date.now())
        })
      });
      statusDiv.innerText = "✨ ¡Tejiendo tu nuevo capítulo en el cuento!...";
    }

    function onResults(results) {
      camCtx.save();
      camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
      camCtx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);
      camCtx.restore();

      curCtx.clearRect(0, 0, curCanvas.width, curCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        const thumb = hand[4];
        const index = hand[8];

        const x = (1.0 - (thumb.x + index.x) / 2) * paintCanvas.width;
        const y = ((thumb.y + index.y) / 2) * paintCanvas.height;
        const isPinching = Math.hypot(thumb.x - index.x, thumb.y - index.y) < 0.07;

        // Glowing Star Pointer
        curCtx.beginPath();
        curCtx.arc(x, y, isPinching ? 7 : 9, 0, 2 * Math.PI);
        curCtx.fillStyle = isPinching ? "#38bdf8" : "rgba(192, 132, 252, 0.6)";
        curCtx.fill();
        curCtx.strokeStyle = "#ffffff";
        curCtx.lineWidth = 2;
        curCtx.shadowColor = "#38bdf8";
        curCtx.shadowBlur = 12;
        curCtx.stroke();

        if (isPinching) {
          statusDiv.innerText = "✍️ Dibujando con luz de estrellas...";
          if (prevPoint) {
            pCtx.strokeStyle = '#38bdf8';
            pCtx.shadowColor = '#c084fc';
            pCtx.shadowBlur = 14;
            pCtx.lineWidth = 5.5;
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            pCtx.beginPath();
            pCtx.moveTo(prevPoint.x, prevPoint.y);
            pCtx.lineTo(x, y);
            pCtx.stroke();
          }
          prevPoint = { x, y };
        } else {
          statusDiv.innerText = "🖐️ Mano lista. Junta índice y pulgar para pintar";
          prevPoint = null;
        }
      } else {
        prevPoint = null;
      }
    }
  </script>
</body>
</html>
