<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #stage {
      position: relative;
      width: 580px;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      background: #090c15;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    #webcam {
      position: absolute;
      top: 0; left: 0;
      width: 1px; height: 1px;
      opacity: 0.001;
      pointer-events: none;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 580px; height: 400px;
    }
    #camCanvas { z-index: 1; transform: scaleX(-1); opacity: 0.85; }
    #paintCanvas { z-index: 2; }
    #cursorCanvas { z-index: 3; pointer-events: none; }
    
    .toolbar {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      font-family: 'JetBrains Mono', monospace;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .btn-clear { background: #1e293b; color: #94a3b8; border-color: #334155; }
    .btn-send { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; }
    button:hover { filter: brightness(1.15); transform: translateY(-1px); }
    #status {
      font-family: 'JetBrains Mono', monospace;
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="camCanvas" width="580" height="400"></canvas>
    <canvas id="paintCanvas" width="580" height="400"></canvas>
    <canvas id="cursorCanvas" width="580" height="400"></canvas>
  </div>

  <div class="toolbar">
    <button class="btn-start" id="startBtn" onclick="startCamera()">[+] ACTIVAR SENSOR</button>
    <button class="btn-clear" onclick="clearCanvas()">PURGAR TRAZO</button>
    <button class="btn-send" onclick="sendToStreamlit()">⚡ SINTETIZAR OBJETO</button>
  </div>
  <div id="status">SENSOR ÓPTICO DESACTIVADO &bull; INICIA PARA COMENZAR</div>

  <script>
    function sendStreamlitMsg(type, data = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }
    function notifyReady() {
      sendStreamlitMsg("streamlit:componentReady", { apiVersion: 1 });
      sendStreamlitMsg("streamlit:setFrameHeight", { height: 485 });
    }
    window.addEventListener("message", (e) => {
      if (e.data.type === "streamlit:render") sendStreamlitMsg("streamlit:setFrameHeight", { height: 485 });
    });
    notifyReady();
    window.addEventListener("load", notifyReady);

    const video = document.getElementById('webcam');
    const camCanvas = document.getElementById('camCanvas');
    const camCtx = camCanvas.getContext('2d');
    const paintCanvas = document.getElementById('paintCanvas');
    const pCtx = paintCanvas.getContext('2d');
    const curCanvas = document.getElementById('cursorCanvas');
    const curCtx = curCanvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    let prevPoint = null;
    let handsDetector = null;
    let isRunning = false;
    let isProcessing = false;

    try {
      handsDetector = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      handsDetector.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
      handsDetector.onResults(onResults);
    } catch (e) {}

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusDiv.innerText = "ERROR: Contexto no seguro (HTTPS requerido)";
        return;
      }
      try {
        startBtn.disabled = true;
        statusDiv.innerText = "INICIALIZANDO LECTURA ÓPTICA...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        isRunning = true;
        startBtn.style.display = "none";
        statusDiv.innerText = "LISTO // PELLIZCA ÍNDICE Y PULGAR PARA VECTORIZAR";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        startBtn.disabled = false;
        statusDiv.innerText = "ERROR DE CÁMARA: " + err.message;
      }
    }

    async function renderLoop() {
      if (!isRunning) return;
      if (!isProcessing && video.readyState >= 2 && !video.paused) {
        isProcessing = true;
        try {
          if (handsDetector) await handsDetector.send({ image: video });
        } catch (e) {}
        isProcessing = false;
      }
      requestAnimationFrame(renderLoop);
    }

    function clearCanvas() {
      pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      statusDiv.innerText = "MEMORIA PURGADA // LIENZO REINICIADO";
    }

    function getBoundingBox(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = 0, maxY = 0;
      let hasPixels = false;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (data[(y * w + x) * 4 + 3] > 30) {
            hasPixels = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!hasPixels) return null;
      return {
        x: Math.max(0, minX - 12),
        y: Math.max(0, minY - 12),
        w: Math.min(w, (maxX - minX) + 24),
        h: Math.min(h, (maxY - minY) + 24)
      };
    }

    function sendToStreamlit() {
      const box = getBoundingBox(pCtx, paintCanvas.width, paintCanvas.height);
      if (!box) {
        statusDiv.innerText = "ERROR: NO HAY VECTOR TRAZADO";
        return;
      }

      const cCanvas = document.createElement('canvas');
      cCanvas.width = box.w; cCanvas.height = box.h;
      cCanvas.getContext('2d').drawImage(paintCanvas, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
      const cutoutBase64 = cCanvas.toDataURL('image/png');

      const vCanvas = document.createElement('canvas');
      vCanvas.width = box.w; vCanvas.height = box.h;
      const vCtx = vCanvas.getContext('2d');
      vCtx.fillStyle = '#FFFFFF';
      vCtx.fillRect(0, 0, box.w, box.h);
      vCtx.drawImage(cCanvas, 0, 0);
      const visionBase64 = vCanvas.toDataURL('image/png');

      // Unique timestamp guarantees Streamlit processes every single click
      sendStreamlitMsg("streamlit:setComponentValue", {
        value: JSON.stringify({
          cutout: cutoutBase64,
          vision: visionBase64,
          req_id: Date.now()
        })
      });
      statusDiv.innerText = "⚡ TRANSMITIENDO VECTOR A OPENAI Y ROBOT...";
    }

    function onResults(results) {
      camCtx.save();
      camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
      camCtx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);
      camCtx.restore();

      curCtx.clearRect(0, 0, curCanvas.width, curCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        const thumb = hand[4];
        const index = hand[8];

        const x = (1.0 - (thumb.x + index.x) / 2) * paintCanvas.width;
        const y = ((thumb.y + index.y) / 2) * paintCanvas.height;
        const isPinching = Math.hypot(thumb.x - index.x, thumb.y - index.y) < 0.07;

        curCtx.beginPath();
        curCtx.arc(x, y, isPinching ? 6 : 8, 0, 2 * Math.PI);
        curCtx.fillStyle = isPinching ? "#38bdf8" : "rgba(255,255,255,0.4)";
        curCtx.fill();
        curCtx.strokeStyle = isPinching ? "#fff" : "#38bdf8";
        curCtx.lineWidth = 1.5;
        curCtx.stroke();

        if (isPinching) {
          statusDiv.innerText = "TRAZANDO COORDENADAS ESPACIALES...";
          if (prevPoint) {
            pCtx.strokeStyle = '#38bdf8';
            pCtx.shadowColor = '#0284c7';
            pCtx.shadowBlur = 12;
            pCtx.lineWidth = 5;
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            pCtx.beginPath();
            pCtx.moveTo(prevPoint.x, prevPoint.y);
            pCtx.lineTo(x, y);
            pCtx.stroke();
          }
          prevPoint = { x, y };
        } else {
          statusDiv.innerText = "PUNTERO CALIBRADO // PELLIZCA PARA GRABAR";
          prevPoint = null;
        }
      } else {
        prevPoint = null;
      }
    }
  </script>
</body>
</html>
