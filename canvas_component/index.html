<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #f8fafc;
      font-family: 'Fredoka', cursive, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #stage {
      position: relative;
      width: 580px;
      height: 400px;
      border-radius: 18px;
      overflow: hidden;
      background: #110d24;
      border: 2px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 8px 32px rgba(112, 0, 255, 0.25);
    }
    /* Kept alive in layout for browser decode pipeline, not display:none */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      pointer-events: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 580px;
      height: 400px;
    }
    #camCanvas { z-index: 1; transform: scaleX(-1); }
    #paintCanvas { z-index: 2; }
    #cursorCanvas { z-index: 3; pointer-events: none; }
    
    .toolbar {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      font-family: 'Fredoka', cursive, sans-serif;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-start { 
      background: linear-gradient(135deg, #10b981, #059669); 
      color: white; 
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-clear { 
      background: linear-gradient(135deg, #f43f5e, #e11d48); 
      color: white; 
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
    }
    .btn-send { 
      background: linear-gradient(135deg, #a855f7, #6366f1); 
      color: white; 
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.45);
    }
    button:hover { 
      transform: translateY(-2px) scale(1.04); 
      filter: brightness(1.1); 
    }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #cbd5e1;
      min-height: 20px;
      max-width: 540px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- Active Video element -->
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="camCanvas" width="580" height="400"></canvas>
    <canvas id="paintCanvas" width="580" height="400"></canvas>
    <canvas id="cursorCanvas" width="580" height="400"></canvas>
  </div>

  <div class="toolbar">
    <button class="btn-start" id="startBtn" onclick="startCamera()">🪄 Activar Varita</button>
    <button class="btn-clear" onclick="clearCanvas()">🧹 Borrador</button>
    <button class="btn-send" onclick="sendToStreamlit()">✨ ¡Darle Vida!</button>
  </div>
  <div id="status">Toca "🪄 Activar Varita" para encender el espejo mágico ✨</div>

  <script>
    // --- Streamlit Lifecycle Handshake ---
    function sendStreamlitMsg(type, data = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function notifyReady() {
      sendStreamlitMsg("streamlit:componentReady", { apiVersion: 1 });
      sendStreamlitMsg("streamlit:setFrameHeight", { height: 490 });
    }

    window.addEventListener("message", (e) => {
      if (e.data.type === "streamlit:render") sendStreamlitMsg("streamlit:setFrameHeight", { height: 490 });
    });
    notifyReady();
    window.addEventListener("load", notifyReady);

    // --- DOM Elements ---
    const video = document.getElementById('webcam');
    const camCanvas = document.getElementById('camCanvas');
    const camCtx = camCanvas.getContext('2d');
    const paintCanvas = document.getElementById('paintCanvas');
    const pCtx = paintCanvas.getContext('2d');
    const curCanvas = document.getElementById('cursorCanvas');
    const curCtx = curCanvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    let prevPoint = null;
    let handsDetector = null;
    let isRunning = false;
    let isProcessingFrame = false;

    // Pre-initialize MediaPipe in the background
    try {
      handsDetector = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      handsDetector.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
      handsDetector.onResults(onResults);
    } catch (e) {
      console.warn("MediaPipe load error:", e);
    }

    // Direct Instant Camera Trigger
    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusDiv.innerHTML = "❌ Tu navegador bloqueó la cámara. Asegúrate de abrir la app con <b>https://</b>";
        statusDiv.style.color = "#f43f5e";
        return;
      }

      try {
        startBtn.disabled = true;
        statusDiv.innerText = "⏳ Solicitando permiso de cámara...";
        statusDiv.style.color = "#fbbf24";

        // 1. Direct getUserMedia call directly on the click event stack
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        isRunning = true;
        startBtn.style.display = "none";
        statusDiv.innerText = "✨ ¡Espejo encendido! Junta los dedos para pintar.";
        statusDiv.style.color = "#34d399";

        // 2. Start detection loop with frame control
        requestAnimationFrame(renderLoop);

      } catch (err) {
        startBtn.disabled = false;
        console.error("Camera error:", err);
        
        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
          statusDiv.innerHTML = "🔒 <b>Permiso bloqueado:</b> Haz clic en el candado 🔒 junto a la URL arriba y permite el acceso a la cámara.";
        } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
          statusDiv.innerHTML = "📷 <b>No se encontró cámara</b> en tu equipo.";
        } else if (err.name === "NotReadableError" || err.name === "TrackStartError") {
          statusDiv.innerHTML = "⚠️ La cámara está siendo usada por otra aplicación (Zoom, Meet, Teams). Ciérrala e intenta de nuevo.";
        } else {
          statusDiv.innerHTML = "❌ Error: " + (err.message || err.name);
        }
        statusDiv.style.color = "#f43f5e";
      }
    }

    // Smooth render & detection loop
    async function renderLoop() {
      if (!isRunning) return;

      if (!isProcessingFrame && video.readyState >= 2 && !video.paused) {
        isProcessingFrame = true;
        try {
          if (handsDetector) {
            await handsDetector.send({ image: video });
          }
        } catch (e) {
          console.warn("Detection skip:", e);
        }
        isProcessingFrame = false;
      }

      requestAnimationFrame(renderLoop);
    }

    function clearCanvas() {
      pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      statusDiv.innerText = "Lienzo limpio como el cielo nocturno 🌌";
    }

    function getBoundingBox(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = 0, maxY = 0;
      let hasPixels = false;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const alpha = data[(y * w + x) * 4 + 3];
          if (alpha > 30) {
            hasPixels = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!hasPixels) return null;
      const pad = 12;
      return {
        x: Math.max(0, minX - pad),
        y: Math.max(0, minY - pad),
        w: Math.min(w, (maxX - minX) + pad * 2),
        h: Math.min(h, (maxY - minY) + pad * 2)
      };
    }

    function sendToStreamlit() {
      const box = getBoundingBox(pCtx, paintCanvas.width, paintCanvas.height);
      if (!box) {
        statusDiv.innerText = "🪄 Dibuja algo primero pellizcando tus deditos en el aire.";
        statusDiv.style.color = "#f43f5e";
        return;
      }

      const cutoutCanvas = document.createElement('canvas');
      cutoutCanvas.width = box.w;
      cutoutCanvas.height = box.h;
      const cCtx = cutoutCanvas.getContext('2d');
      cCtx.drawImage(paintCanvas, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
      const cutoutBase64 = cutoutCanvas.toDataURL('image/png');

      const visionCanvas = document.createElement('canvas');
      visionCanvas.width = box.w;
      visionCanvas.height = box.h;
      const vCtx = visionCanvas.getContext('2d');
      vCtx.fillStyle = '#FFFFFF';
      vCtx.fillRect(0, 0, box.w, box.h);
      vCtx.drawImage(cutoutCanvas, 0, 0);
      const visionBase64 = visionCanvas.toDataURL('image/png');

      sendStreamlitMsg("streamlit:setComponentValue", {
        value: JSON.stringify({ cutout: cutoutBase64, vision: visionBase64 })
      });
      statusDiv.innerText = "✨ ¡Despertando la magia del cuento!...";
      statusDiv.style.color = "#38bdf8";
    }

    function onResults(results) {
      camCtx.save();
      camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
      camCtx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);
      camCtx.restore();

      curCtx.clearRect(0, 0, curCanvas.width, curCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        const thumb = hand[4];
        const index = hand[8];

        const x = (1.0 - (thumb.x + index.x) / 2) * paintCanvas.width;
        const y = ((thumb.y + index.y) / 2) * paintCanvas.height;

        const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        const isPinching = dist < 0.07;

        curCtx.beginPath();
        curCtx.arc(x, y, isPinching ? 8 : 6, 0, 2 * Math.PI);
        curCtx.fillStyle = isPinching ? "#38bdf8" : "#fbbf24";
        curCtx.fill();
        curCtx.strokeStyle = "#ffffff";
        curCtx.lineWidth = 2;
        curCtx.stroke();

        if (isPinching) {
          statusDiv.innerText = "✍️ ¡Pintando con chispas de luz!";
          statusDiv.style.color = "#38bdf8";

          if (prevPoint) {
            pCtx.strokeStyle = '#38bdf8';
            pCtx.shadowColor = '#818cf8';
            pCtx.shadowBlur = 10;
            pCtx.lineWidth = 6;
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            pCtx.beginPath();
            pCtx.moveTo(prevPoint.x, prevPoint.y);
            pCtx.lineTo(x, y);
            pCtx.stroke();
          }
          prevPoint = { x, y };
        } else {
          statusDiv.innerText = "🖐️ Mano lista. Junta índice y pulgar para pintar 🪄";
          statusDiv.style.color = "#fbbf24";
          prevPoint = null;
        }
      } else {
        statusDiv.innerText = "Muestra tu manita frente a la cámara...";
        statusDiv.style.color = "#94a3b8";
        prevPoint = null;
      }
    }
  </script>
</body>
</html>
