<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0e1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #stage {
      position: relative;
      width: 600px;
      height: 440px;
      border-radius: 12px;
      overflow: hidden;
      background: #1a1c23;
      border: 1px solid #30363d;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 600px;
      height: 440px;
    }
    #camCanvas { z-index: 1; transform: scaleX(-1); }
    #paintCanvas { z-index: 2; }
    #cursorCanvas { z-index: 3; pointer-events: none; }
    .toolbar {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start { background: #238636; color: white; }
    .btn-clear { background: #da3633; color: white; }
    .btn-send { background: #1f6feb; color: white; }
    button:hover { opacity: 0.85; transform: scale(1.02); }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #e3b341;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="camCanvas" width="600" height="440"></canvas>
    <canvas id="paintCanvas" width="600" height="440"></canvas>
    <canvas id="cursorCanvas" width="600" height="440"></canvas>
  </div>

  <div class="toolbar">
    <button class="btn-start" id="startBtn" onclick="startCamera()">🎥 Iniciar Cámara</button>
    <button class="btn-clear" onclick="clearCanvas()">🗑️ Limpiar Trazo</button>
    <button class="btn-send" onclick="sendToStreamlit()">✨ Enviar Dibujo a OpenAI</button>
  </div>
  <div id="status">Presiona "🎥 Iniciar Cámara" y autoriza el acceso en tu navegador.</div>

  <script>
    // --- Streamlit Component Handshake ---
    function sendStreamlitMsg(type, data = {}) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: type,
        ...data
      }, "*");
    }

    function notifyReady() {
      sendStreamlitMsg("streamlit:componentReady", { apiVersion: 1 });
      sendStreamlitMsg("streamlit:setFrameHeight", { height: 530 });
    }

    window.addEventListener("message", (event) => {
      if (event.data.type === "streamlit:render") {
        sendStreamlitMsg("streamlit:setFrameHeight", { height: 530 });
      }
    });

    notifyReady();
    window.addEventListener("load", notifyReady);

    // --- MediaPipe and Drawing Logic ---
    const video = document.getElementById('webcam');
    const camCanvas = document.getElementById('camCanvas');
    const camCtx = camCanvas.getContext('2d');
    const paintCanvas = document.getElementById('paintCanvas');
    const pCtx = paintCanvas.getContext('2d');
    const curCanvas = document.getElementById('cursorCanvas');
    const curCtx = curCanvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    let prevPoint = null;
    let cameraInstance = null;

    function clearCanvas() {
      pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      statusDiv.innerText = "Lienzo limpiado. Junta los dedos para comenzar de nuevo.";
    }

    function sendToStreamlit() {
      const expCanvas = document.createElement('canvas');
      expCanvas.width = 600;
      expCanvas.height = 440;
      const expCtx = expCanvas.getContext('2d');
      expCtx.fillStyle = '#FFFFFF';
      expCtx.fillRect(0, 0, 600, 440);
      expCtx.drawImage(paintCanvas, 0, 0);

      const base64Png = expCanvas.toDataURL('image/png');
      sendStreamlitMsg("streamlit:setComponentValue", { value: base64Png });
      statusDiv.innerText = "✅ ¡Dibujo enviado a Streamlit!";
      statusDiv.style.color = "#3fb950";
    }

    function onResults(results) {
      // 1. Draw video feed
      camCtx.save();
      camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
      camCtx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);
      camCtx.restore();

      // 2. Clear pointer overlay
      curCtx.clearRect(0, 0, curCanvas.width, curCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        const thumb = hand[4];
        const index = hand[8];

        const x = (1.0 - (thumb.x + index.x) / 2) * paintCanvas.width;
        const y = ((thumb.y + index.y) / 2) * paintCanvas.height;

        const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        const isPinching = dist < 0.075;

        // Draw cursor pointer
        curCtx.beginPath();
        curCtx.arc(x, y, isPinching ? 8 : 6, 0, 2 * Math.PI);
        curCtx.fillStyle = isPinching ? "#00f2fe" : "#f1c40f";
        curCtx.fill();
        curCtx.strokeStyle = "#ffffff";
        curCtx.lineWidth = 2;
        curCtx.stroke();

        if (isPinching) {
          statusDiv.innerText = "✍️ DIBUJANDO (Pellizco activo)";
          statusDiv.style.color = "#00f2fe";

          if (prevPoint) {
            pCtx.strokeStyle = '#00f2fe';
            pCtx.lineWidth = 6;
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            pCtx.beginPath();
            pCtx.moveTo(prevPoint.x, prevPoint.y);
            pCtx.lineTo(x, y);
            pCtx.stroke();
          }
          prevPoint = { x, y };
        } else {
          statusDiv.innerText = "✋ Mano detectada (Junta índice y pulgar para dibujar)";
          statusDiv.style.color = "#f1c40f";
          prevPoint = null;
        }
      } else {
        statusDiv.innerText = "Muestra tu mano frente a la cámara...";
        statusDiv.style.color = "#8b949e";
        prevPoint = null;
      }
    }

    async function startCamera() {
      try {
        statusDiv.innerText = "Iniciando cámara y MediaPipe...";
        startBtn.disabled = true;

        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        cameraInstance = new Camera(video, {
          onFrame: async () => { await hands.send({ image: video }); },
          width: 600,
          height: 440
        });

        await cameraInstance.start();
        startBtn.style.display = "none";
        statusDiv.innerText = "✅ Cámara activa. Junta índice y pulgar para dibujar.";
        statusDiv.style.color = "#3fb950";
      } catch (err) {
        statusDiv.innerText = "❌ Error al acceder a la cámara: " + err.message;
        statusDiv.style.color = "#da3633";
        startBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
