<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0e1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #stage {
      position: relative;
      width: 580px;
      height: 420px;
      border-radius: 12px;
      overflow: hidden;
      background: #161b22;
      border: 1px solid #30363d;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 580px;
      height: 420px;
    }
    #camCanvas { z-index: 1; transform: scaleX(-1); }
    #paintCanvas { z-index: 2; }
    #cursorCanvas { z-index: 3; pointer-events: none; }
    .toolbar {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start { background: #238636; color: white; }
    .btn-clear { background: #da3633; color: white; }
    .btn-send { background: #1f6feb; color: white; }
    button:hover { opacity: 0.85; transform: scale(1.02); }
    #status {
      margin-top: 6px;
      font-size: 12px;
      color: #e3b341;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="camCanvas" width="580" height="420"></canvas>
    <canvas id="paintCanvas" width="580" height="420"></canvas>
    <canvas id="cursorCanvas" width="580" height="420"></canvas>
  </div>

  <div class="toolbar">
    <button class="btn-start" id="startBtn" onclick="startCamera()">🎥 Iniciar Cámara</button>
    <button class="btn-clear" onclick="clearCanvas()">🗑️ Limpiar Trazo</button>
    <button class="btn-send" onclick="sendToStreamlit()">✨ Enviar Recorte a OpenAI</button>
  </div>
  <div id="status">Presiona "🎥 Iniciar Cámara" para comenzar.</div>

  <script>
    function sendStreamlitMsg(type, data = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function notifyReady() {
      sendStreamlitMsg("streamlit:componentReady", { apiVersion: 1 });
      sendStreamlitMsg("streamlit:setFrameHeight", { height: 500 });
    }

    window.addEventListener("message", (e) => {
      if (e.data.type === "streamlit:render") sendStreamlitMsg("streamlit:setFrameHeight", { height: 500 });
    });
    notifyReady();
    window.addEventListener("load", notifyReady);

    const video = document.getElementById('webcam');
    const camCanvas = document.getElementById('camCanvas');
    const camCtx = camCanvas.getContext('2d');
    const paintCanvas = document.getElementById('paintCanvas');
    const pCtx = paintCanvas.getContext('2d');
    const curCanvas = document.getElementById('cursorCanvas');
    const curCtx = curCanvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    let prevPoint = null;

    function clearCanvas() {
      pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      statusDiv.innerText = "Lienzo limpio.";
    }

    // Calculates the tight bounding box of pixels to make a transparent cutout
    function getBoundingBox(ctx, w, h) {
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = 0, maxY = 0;
      let hasPixels = false;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const alpha = data[(y * w + x) * 4 + 3];
          if (alpha > 30) {
            hasPixels = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!hasPixels) return null;
      const pad = 12;
      return {
        x: Math.max(0, minX - pad),
        y: Math.max(0, minY - pad),
        w: Math.min(w, (maxX - minX) + pad * 2),
        h: Math.min(h, (maxY - minY) + pad * 2)
      };
    }

    function sendToStreamlit() {
      const box = getBoundingBox(pCtx, paintCanvas.width, paintCanvas.height);
      if (!box) {
        statusDiv.innerText = "⚠️ Dibuja algo primero pellizcando con los dedos.";
        statusDiv.style.color = "#f85149";
        return;
      }

      // 1. Transparent Cutout Canvas (for the dancing animation)
      const cutoutCanvas = document.createElement('canvas');
      cutoutCanvas.width = box.w;
      cutoutCanvas.height = box.h;
      const cCtx = cutoutCanvas.getContext('2d');
      cCtx.drawImage(paintCanvas, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
      const cutoutBase64 = cutoutCanvas.toDataURL('image/png');

      // 2. High-contrast White Canvas (for OpenAI Vision recognition)
      const visionCanvas = document.createElement('canvas');
      visionCanvas.width = box.w;
      visionCanvas.height = box.h;
      const vCtx = visionCanvas.getContext('2d');
      vCtx.fillStyle = '#FFFFFF';
      vCtx.fillRect(0, 0, box.w, box.h);
      vCtx.drawImage(cutoutCanvas, 0, 0);
      const visionBase64 = visionCanvas.toDataURL('image/png');

      const payload = JSON.stringify({
        cutout: cutoutBase64,
        vision: visionBase64
      });

      sendStreamlitMsg("streamlit:setComponentValue", { value: payload });
      statusDiv.innerText = "✅ ¡Recorte transparente enviado!";
      statusDiv.style.color = "#3fb950";
    }

    function onResults(results) {
      camCtx.save();
      camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
      camCtx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);
      camCtx.restore();

      curCtx.clearRect(0, 0, curCanvas.width, curCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        const thumb = hand[4];
        const index = hand[8];

        const x = (1.0 - (thumb.x + index.x) / 2) * paintCanvas.width;
        const y = ((thumb.y + index.y) / 2) * paintCanvas.height;

        const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        const isPinching = dist < 0.07;

        curCtx.beginPath();
        curCtx.arc(x, y, isPinching ? 8 : 6, 0, 2 * Math.PI);
        curCtx.fillStyle = isPinching ? "#00f2fe" : "#f1c40f";
        curCtx.fill();
        curCtx.strokeStyle = "#ffffff";
        curCtx.lineWidth = 2;
        curCtx.stroke();

        if (isPinching) {
          statusDiv.innerText = "✍️ DIBUJANDO (Pellizco activo)";
          statusDiv.style.color = "#00f2fe";

          if (prevPoint) {
            pCtx.strokeStyle = '#00f2fe';
            pCtx.shadowColor = '#00f2fe';
            pCtx.shadowBlur = 10;
            pCtx.lineWidth = 6;
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            pCtx.beginPath();
            pCtx.moveTo(prevPoint.x, prevPoint.y);
            pCtx.lineTo(x, y);
            pCtx.stroke();
          }
          prevPoint = { x, y };
        } else {
          statusDiv.innerText = "✋ Mano detectada (Junta índice y pulgar para pintar)";
          statusDiv.style.color = "#f1c40f";
          prevPoint = null;
        }
      } else {
        statusDiv.innerText = "Muestra tu mano frente a la cámara...";
        statusDiv.style.color = "#8b949e";
        prevPoint = null;
      }
    }

    async function startCamera() {
      try {
        startBtn.disabled = true;
        statusDiv.innerText = "Cargando MediaPipe...";

        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
          onFrame: async () => { await hands.send({ image: video }); },
          width: 580,
          height: 420
        });
        await camera.start();
        startBtn.style.display = "none";
        statusDiv.innerText = "✅ Cámara activa. Dibuja en el aire pellizcando tus dedos.";
        statusDiv.style.color = "#3fb950";
      } catch (e) {
        statusDiv.innerText = "❌ Error: " + e.message;
        statusDiv.style.color = "#da3633";
        startBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
